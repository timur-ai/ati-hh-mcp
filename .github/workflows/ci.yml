name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 3.14: допускаем падение из-за транзитивных зависимостей (план, M9:
    # документированное отступление – бейдж + issue, релиз не блокируется).
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest -q

  # Docker smoke (M7): сборка образа из исходников, /health, tools/list
  # по HTTP с авторизацией MCP_API_KEYS, проверка 401 без ключа.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ati-hh-mcp:ci .

      - name: Run container (random host port, API key required)
        run: |
          docker run -d --name ati-hh-mcp-ci \
            -p 18080:8080 \
            -e MCP_API_KEYS=test-key \
            -e HH_UA_EMAIL=ci@example.com \
            ati-hh-mcp:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/health; then echo; exit 0; fi
            sleep 2
          done
          echo "health check failed" >&2
          docker logs ati-hh-mcp-ci >&2 || true
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: MCP tools/list over HTTP (authorized)
        run: |
          uv run python - <<'EOF'
          import asyncio

          from fastmcp import Client
          from fastmcp.client.transports import StreamableHttpTransport


          async def main() -> None:
              transport = StreamableHttpTransport(
                  url="http://localhost:18080/mcp",
                  headers={"Authorization": "Bearer test-key"},
              )
              async with Client(transport) as client:
                  tools = await client.list_tools()
              names = {tool.name for tool in tools}
              assert "dict_dictionaries" in names, sorted(names)[:10]
              assert not any(n.startswith("employer_") for n in names)
              print(f"tools/list OK: {len(names)} tools")

          asyncio.run(main())
          EOF

      - name: Unauthorized request must be 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/mcp)
          test "$code" = "401"

      - name: Stop container
        if: always()
        run: docker rm -f ati-hh-mcp-ci

  # TODO M9: install-from-git – свежее окружение,
  # `uvx --from git+${repo}@sha ati-hh-mcp --version`, затем MCP initialize
