name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Живые read-only пробы api.hh.ru: еженедельно, понедельник 06:10 UTC.
    - cron: "10 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 3.14: допускаем падение из-за транзитивных зависимостей (план, M9:
    # документированное отступление – бейдж + issue, релиз не блокируется).
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests with coverage (>= 95%)
        run: uv run pytest --cov=ati_hh_mcp --cov-report=term --cov-fail-under=95 -q

  # Живые read-only пробы api.hh.ru (M9): только ручной запуск и еженедельный
  # cron (не на каждый push – беречь квоты живого API). Без секрета
  # HH_LIVE_TOKEN авторизованные тесты пропускаются скипами.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Live read-only tests
        env:
          HH_LIVE_TOKEN: ${{ secrets.HH_LIVE_TOKEN }}
        run: uv run pytest -m live tests/integration_live -q -rs

  # Проверка пути быстрого старта из README (M9): uvx из git по SHA –
  # версия и мини-обмен initialize/tools/list по stdio. Корректна после
  # публикации репозитория (M10); до этого job просто не найдёт remote.
  install-from-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install from git and check version
        run: |
          SHA=$(git rev-parse HEAD)
          uvx --from "git+https://github.com/timur-ai/ati-hh-mcp@${SHA}" ati-hh-mcp --version

      - name: MCP initialize + tools/list via uvx (stdio)
        run: |
          SHA=$(git rev-parse HEAD)
          SHA="$SHA" python3 - <<'EOF'
          import json, os, subprocess

          cmd = [
              "uvx", "--from",
              f"git+https://github.com/timur-ai/ati-hh-mcp@{os.environ['SHA']}",
              "ati-hh-mcp", "serve", "--transport", "stdio",
          ]
          proc = subprocess.Popen(
              cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, text=True,
          )
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                  "protocolVersion": "2025-03-26", "capabilities": {},
                  "clientInfo": {"name": "ci-install-check", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          for request in requests:
              proc.stdin.write(json.dumps(request) + "\n")
          proc.stdin.flush()

          replies = []
          for _ in range(2):
              line = proc.stdout.readline()
              if not line:
                  break
              replies.append(json.loads(line))
          proc.terminate()

          by_id = {r.get("id"): r for r in replies}
          tools = by_id[2]["result"]["tools"]
          names = {t["name"] for t in tools}
          assert "dict_dictionaries" in names, sorted(names)[:10]
          assert not any(name.startswith("employer_") for name in names)
          print(f"install-from-git MCP check OK: {len(names)} tools")
          EOF

  # Docker smoke (M7): сборка образа из исходников, /health, tools/list
  # по HTTP с авторизацией MCP_API_KEYS, проверка 401 без ключа.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ati-hh-mcp:ci .

      - name: Run container (random host port, API key required)
        run: |
          docker run -d --name ati-hh-mcp-ci \
            -p 18080:8080 \
            -e MCP_API_KEYS=test-key \
            -e HH_UA_EMAIL=ci@example.com \
            ati-hh-mcp:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/health; then echo; exit 0; fi
            sleep 2
          done
          echo "health check failed" >&2
          docker logs ati-hh-mcp-ci >&2 || true
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: MCP tools/list over HTTP (authorized)
        run: |
          uv run python - <<'EOF'
          import asyncio

          from fastmcp import Client
          from fastmcp.client.transports import StreamableHttpTransport


          async def main() -> None:
              transport = StreamableHttpTransport(
                  url="http://localhost:18080/mcp",
                  headers={"Authorization": "Bearer test-key"},
              )
              async with Client(transport) as client:
                  tools = await client.list_tools()
              names = {tool.name for tool in tools}
              assert "dict_dictionaries" in names, sorted(names)[:10]
              assert not any(n.startswith("employer_") for n in names)
              print(f"tools/list OK: {len(names)} tools")

          asyncio.run(main())
          EOF

      - name: Unauthorized request must be 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/mcp)
          test "$code" = "401"

      - name: Stop container
        if: always()
        run: docker rm -f ati-hh-mcp-ci

  # TODO M9: install-from-git – свежее окружение,
  # `uvx --from git+${repo}@sha ati-hh-mcp --version`, затем MCP initialize
  # + tools/list тем же путём (проверка quick-start из README).
