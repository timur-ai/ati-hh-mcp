[project]
name = "ati-hh-mcp"
version = "0.1.0"
description = "Public MCP server for the hh.ru API: all OpenAPI operations as toolsets, stdio and HTTP transports"
readme = "README.md"
authors = [
    { name = "Timur Aribzhanov", email = "timur.aribzhanov@mail.ru" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
ati-hh-mcp = "ati_hh_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "UP045", # Optional[X] -> X | None: держим совместимый синтаксис 3.10
    "UP007", # Union[X, Y] -> X | None: то же
]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["fastmcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
